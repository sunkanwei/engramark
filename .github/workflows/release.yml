name: 发布候选

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: 发布静态与供应链门禁
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # Rust 1.97.1 support
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: 静态检查
        run: |
          python3 tests/test_repository_privacy.py
          python3 tests/test_documentation.py
          uvx ruff==0.15.4 check packaging tests
          shellcheck install.sh bin/install.sh bin/uninstall bin/uninstall.sh
          cd rust
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: 依赖漏洞、许可证与来源检查
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.0.15
        with:
          command: check
          manifest-path: rust/Cargo.toml
          arguments: --all-features
          command-arguments: advisories licenses sources

  build:
    name: ${{ matrix.target }} 发布候选
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
            extension: tar.gz
          - os: macos-15-intel
            target: macos-x86_64
            extension: tar.gz
          - os: ubuntu-22.04
            target: linux-x86_64
            extension: tar.gz
          - os: windows-2022
            target: windows-x86_64
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # Rust 1.97.1 support
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
      - name: 校验版本
        shell: bash
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          grep -q "^version = \"$(cat VERSION)\"" rust/Cargo.toml
      - name: 完整测试、构建与安装生命周期
        run: |
          python tests/run.py
          python packaging/build_release.py --target ${{ matrix.target }}
          python tests/test_install_lifecycle.py
      - name: 上传原生候选包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engramark-${{ matrix.target }}
          path: dist/engramark-*.${{ matrix.extension }}
          if-no-files-found: error

  compatibility:
    name: ${{ matrix.target }} 当前系统复验
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: engramark-${{ matrix.target }}
          path: dist
      - name: 在当前系统复验同一候选包
        run: python tests/test_install_lifecycle.py

  draft:
    name: 汇总、证明并创建草稿
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: engramark-*
          path: dist
          merge-multiple: true
      - name: 生成统一校验清单
        run: |
          cd dist
          find . -maxdepth 1 -type f -name 'engramark-*' -printf '%f\n' | LC_ALL=C sort |
            while read -r file; do sha256sum "$file"; done > checksums.txt
          test "$(wc -l < checksums.txt)" -eq 4
      - name: 生成 GitHub 构建来源证明
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.0.0
        with:
          subject-path: |
            dist/engramark-*
            dist/checksums.txt
      - name: 创建未公开的发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/engramark-* dist/checksums.txt
          --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
