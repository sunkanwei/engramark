<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" role="img" aria-label="How Engramark injects relevant memory hints">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2a"/>
    </linearGradient>
  </defs>
  <style>
    .t{fill:#e6edf3}
    .s{fill:#8b949e}
    .card{fill:#161b22;stroke:#30363d}
    .cardBack{fill:#121820;stroke:#2a313b}
    .acc{fill:#2dd4bf}
    .accs{stroke:#2dd4bf}
    .ln{fill:#3d444d}
    .ghost{stroke:#484f58}
    .ghostT{fill:#6e7681}
    .arrow{stroke:#484f58}
    text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif}
  </style>

  <rect x="0.5" y="0.5" width="839" height="239" rx="14" fill="url(#bg)" stroke="#21262d"/>

  <text class="s" x="28" y="50" font-size="11">Question</text>
  <rect class="card" x="28" y="60" width="190" height="76" rx="10" stroke-width="1.5"/>
  <text class="t" x="123" y="96" font-size="13" text-anchor="middle">What was that build</text>
  <text class="t" x="123" y="116" font-size="13" text-anchor="middle">command again?</text>

  <path d="M222,98 L248,98" class="arrow" stroke-width="1.5" fill="none"/>
  <polyline points="244,94 250,98 244,102" class="arrow" stroke-width="1.5" fill="none"/>

  <rect class="cardBack" x="274" y="34" width="140" height="88" rx="6" stroke-width="1.5"/>
  <rect class="cardBack" x="282" y="44" width="140" height="88" rx="6" stroke-width="1.5"/>
  <rect class="cardBack" x="290" y="54" width="140" height="88" rx="6" stroke-width="1.5"/>
  <rect class="cardBack" x="298" y="64" width="140" height="88" rx="6" stroke-width="1.5"/>
  <rect class="card" x="306" y="74" width="140" height="88" rx="6" stroke-width="1.5"/>
  <rect class="acc" x="318" y="88" width="60" height="7" rx="3.5" opacity="0.85"/>
  <rect class="ln" x="318" y="104" width="116" height="6" rx="3"/>
  <rect class="ln" x="318" y="118" width="88" height="6" rx="3"/>
  <text class="s" x="376" y="188" font-size="11" text-anchor="middle">thousands of local memories</text>

  <g opacity="0">
    <rect class="acc" x="274" y="28" width="3" height="140" rx="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;172 0;172 0" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.28;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <rect class="accs" x="306" y="74" width="140" height="88" rx="6" fill="none" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.24;0.32;0.45;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0">
    <rect class="acc" x="450" y="92" width="30" height="5" rx="2.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;114 40;114 40" keyTimes="0;0.3;0.52;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.34;0.5;0.56;1" dur="6s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect class="acc" x="450" y="106" width="30" height="5" rx="2.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;114 28;114 28" keyTimes="0;0.32;0.54;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.36;0.52;0.58;1" dur="6s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect class="acc" x="450" y="120" width="30" height="5" rx="2.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;114 16;114 16" keyTimes="0;0.34;0.56;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.54;0.6;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <text class="s" x="564" y="50" font-size="11">Context window</text>
  <rect x="564" y="60" width="244" height="60" rx="8" fill="none" class="ghost" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="ghostT" x="686" y="86" font-size="12" text-anchor="middle">Full text: 500–3,000 tokens/turn</text>
  <text class="ghostT" x="686" y="104" font-size="11" text-anchor="middle">consumes the conversation budget</text>

  <text class="s" x="564" y="136" font-size="11">Engramark</text>
  <rect class="acc" x="564" y="142" width="244" height="22" rx="6" fill-opacity="0.16">
    <animate attributeName="fill-opacity" values="0.16;0.16;0.55;0.16;0.16" keyTimes="0;0.5;0.58;0.68;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="564" y="142" width="244" height="22" rx="6" fill="none" class="accs" stroke-width="1"/>
  <text class="t" x="686" y="157" font-size="11" text-anchor="middle">hit: ≤3 memory hints · ≈60 tokens</text>
  <text class="s" x="564" y="182" font-size="11">miss = 0 tokens</text>
  <text class="s" x="564" y="200" font-size="11">details on demand: ≤5 × 2,000 bytes</text>

  <text class="s" x="420" y="226" font-size="11.5" text-anchor="middle">The radar admits short hints; full text stays local and is fetched through MCP when needed.</text>
</svg>
