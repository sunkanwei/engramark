[package]
name = "engramark"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Engramark long-term memory kernel, CLI, MCP server and host wiring"

[lib]
name = "engramark"
path = "src/lib.rs"

[[bin]]
name = "engramark"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "limits"] }
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
tempfile = "3"
unicode-normalization = "0.1.24"
time = { version = "0.3", features = ["local-offset", "formatting", "parsing", "macros"] }
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
